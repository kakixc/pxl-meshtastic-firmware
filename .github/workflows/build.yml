name: Build PXL Heltec V3 baseline

on:
  workflow_dispatch:
    inputs:
      meshtastic_tag:
        description: "Official Meshtastic tag"
        required: true
        default: "v2.7.26.54e0d8d"
        type: string

permissions:
  contents: read

concurrency:
  group: pxl-heltec-v3-baseline
  cancel-in-progress: false

env:
  PXL_VERSION: "0.2"
  PXL_REV: "2"


jobs:

  # ============================================================
  # Resolve upstream release
  # ============================================================

  prepare:
    name: Resolve upstream
    runs-on: ubuntu-latest

    outputs:
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}

    steps:

      - name: Resolve Meshtastic version
        id: version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.meshtastic_tag }}
        run: |
          set -euo pipefail

          UPSTREAM_TAG="${MANUAL_TAG:?Meshtastic tag is required}"
          if [ "$UPSTREAM_TAG" != "v2.7.26.54e0d8d" ]; then
            echo "This experimental build only supports v2.7.26.54e0d8d" >&2
            exit 1
          fi

          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          echo "Upstream:    $UPSTREAM_TAG"
          echo "PXL version: $PXL_VERSION"


  # ============================================================
  # Build
  # ============================================================

  build:
    name: Build ${{ matrix.display_name }}

    needs:
      - prepare

    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false

      matrix:
        include:
          - board: heltec-v3
            display_name: Heltec V3
            extension: bin


    steps:

      # --------------------------------------------------------
      # Toolchain
      # --------------------------------------------------------

      - name: Checkout PXL build scripts
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install platformio==6.1.19


      # --------------------------------------------------------
      # Exact upstream source
      # --------------------------------------------------------

      - name: Clone Meshtastic
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          echo "Cloning Meshtastic $UPSTREAM_TAG"

          git clone \
            --depth 1 \
            --branch "$UPSTREAM_TAG" \
            https://github.com/meshtastic/firmware.git \
            firmware

          cd firmware

          git submodule update \
            --init \
            --recursive


      # --------------------------------------------------------
      # PXL patches
      # --------------------------------------------------------

      - name: Apply PXL 0.2 patches
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/apply_pxl.py --firmware-dir firmware


      # --------------------------------------------------------
      # Validate generated source
      # --------------------------------------------------------

      - name: Validate PXL diff
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo
          echo "===== DIFF STAT ====="
          git --no-pager diff --stat

          echo
          echo "===== PXL REFERENCES ====="

          grep -R \
            --line-number \
            --exclude-dir=.pio \
            "PXL" \
            src/graphics \
            userPrefs.jsonc \
            | head -n 100


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build ${{ matrix.display_name }}
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail

          echo "Target: ${{ matrix.board }}"
          echo "PXL:    $PXL_VERSION"
          echo

          python -m platformio run \
            -e "${{ matrix.board }}"


      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package firmware
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          EXT: ${{ matrix.extension }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          mkdir -p dist

          BUILD_DIR="firmware/.pio/build/$BOARD"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Build directory does not exist:"
            echo "$BUILD_DIR"
            exit 1
          fi


          # ====================================================
          # Find UPDATE image
          # ====================================================

          UPDATE="$(
            find "$BUILD_DIR" \
              -maxdepth 1 \
              -type f \
              -name "firmware-${BOARD}-*.${EXT}" \
              ! -name "*.factory.${EXT}" \
              | sort \
              | head -n 1
          )"


          # Fallback for targets using generic firmware filename.

          if [ -z "$UPDATE" ]; then
            UPDATE="$(
              find "$BUILD_DIR" \
                -maxdepth 1 \
                -type f \
                -name "firmware*.${EXT}" \
                ! -name "*.factory.${EXT}" \
                | sort \
                | head -n 1
            )"
          fi


          if [ -z "$UPDATE" ] || [ ! -f "$UPDATE" ]; then
            echo "ERROR: update firmware was not found."
            echo
            find "$BUILD_DIR" -maxdepth 1 -type f -print
            exit 1
          fi


          UPDATE_OUT="dist/meshtastic-${BOARD}-${UPSTREAM_TAG}-PXL.${PXL_REV}-update.${EXT}"

          cp \
            "$UPDATE" \
            "$UPDATE_OUT"


          # ====================================================
          # Find FACTORY image
          # ====================================================

          FACTORY="$(
            find "$BUILD_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.factory.${EXT}" \
              | sort \
              | head -n 1
          )"


          if [ -n "$FACTORY" ] && [ -f "$FACTORY" ]; then

            FACTORY_OUT="dist/meshtastic-${BOARD}-${UPSTREAM_TAG}-PXL.${PXL_REV}-factory.${EXT}"

            cp \
              "$FACTORY" \
              "$FACTORY_OUT"

            echo "Factory image found."

          else

            echo "No factory .$EXT generated for $BOARD."
          fi


          # ====================================================
          # Checksums
          # ====================================================

          for fw in dist/*.${EXT}; do
            [ -e "$fw" ] || continue

            sha256sum "$fw" \
              > "${fw}.sha256"
          done


          # ====================================================
          # Build metadata
          # ====================================================

          cat > "dist/${BOARD}-BUILD.txt" <<EOF
          PXL Meshtastic Firmware

          PXL version:
          ${PXL_VERSION}

          PXL revision:
          ${PXL_REV}

          Upstream Meshtastic:
          ${UPSTREAM_TAG}

          PlatformIO target:
          ${BOARD}

          Changes:
          - OLED_RU
          - PXL animated boot on non-EInk displays
          - PXL static boot on E-Ink displays
          - PXL firmware version branding
          - PXL STATUS
          - shorter boot stage

          Unchanged:
          - LoRa protocol
          - routing
          - region limits
          - TX power limits
          - radio stack

          Recommended image for existing configured devices:
          *-update.${EXT}

          Factory image:
          published only when generated by the upstream target.
          EOF


          echo
          echo "===== PACKAGED FILES ====="
          ls -lah dist


      # --------------------------------------------------------
      # Artifact
      # --------------------------------------------------------

      - name: Upload ${{ matrix.display_name }}
        uses: actions/upload-artifact@v4
        with:
          name: pxl-${{ matrix.board }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
