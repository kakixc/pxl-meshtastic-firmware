name: Build PXL Meshtastic Multi-Board

on:
  workflow_dispatch:
    inputs:
      meshtastic_tag:
        description: "Meshtastic tag (empty = latest stable)"
        required: false
        type: string

      force_rebuild:
        description: "Rebuild even if PXL release already exists"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

env:
  PXL_REV: "1"

jobs:
  # ============================================================
  # Find latest official stable Meshtastic release
  # ============================================================

  prepare:
    runs-on: ubuntu-latest

    outputs:
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
      pxl_tag: ${{ steps.version.outputs.pxl_tag }}
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Resolve Meshtastic version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.meshtastic_tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            UPSTREAM_TAG="$MANUAL_TAG"
          else
            UPSTREAM_TAG="$(gh api repos/meshtastic/firmware/releases/latest --jq '.tag_name')"
          fi

          PXL_TAG="${UPSTREAM_TAG}-PXL.${PXL_REV}"

          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "pxl_tag=$PXL_TAG" >> "$GITHUB_OUTPUT"

          echo "Official Meshtastic: $UPSTREAM_TAG"
          echo "PXL release:        $PXL_TAG"

      - name: Check existing PXL release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PXL_TAG: ${{ steps.version.outputs.pxl_tag }}
          FORCE: ${{ inputs.force_rebuild }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$PXL_TAG" >/dev/null 2>&1; then
            echo "Release $PXL_TAG already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New PXL build required."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # Build all boards
  # ============================================================

  build:
    needs: prepare

    if: needs.prepare.outputs.skip != 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - board: tlora-t3s3-v1
            display_name: "LilyGo T3S3"
            extension: bin

          - board: tlora-t3s3-epaper
            display_name: "LilyGo T3S3 E-Paper"
            extension: bin

          - board: tlora-t3s3-epaper-inkhud
            display_name: "LilyGo T3S3 E-Paper InkHUD"
            extension: bin

          - board: heltec-v4
            display_name: "Heltec V4"
            extension: bin

          - board: heltec-v3
            display_name: "Heltec V3"
            extension: bin

          - board: heltec-mesh-node-t114
            display_name: "Heltec Mesh Node T114"
            extension: uf2

          - board: heltec-mesh-node-t096
            display_name: "Heltec Mesh Node T096"
            extension: uf2

    steps:

      # --------------------------------------------------------
      # Tools
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio


      # --------------------------------------------------------
      # Clone EXACT official release
      # --------------------------------------------------------

      - name: Clone Meshtastic
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          echo "Cloning official Meshtastic $UPSTREAM_TAG"

          git clone \
            --depth 1 \
            --branch "$UPSTREAM_TAG" \
            https://github.com/meshtastic/firmware.git firmware

          cd firmware
          git submodule update --init --recursive


      # --------------------------------------------------------
      # Apply PXL customizations
      # --------------------------------------------------------

      - name: Apply PXL patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("firmware")


          # ====================================================
          # Helpers
          # ====================================================

          def read(path):
              return path.read_text(encoding="utf-8")


          def write(path, text):
              path.write_text(text, encoding="utf-8")


          def find_one(pattern, text, name, flags=0):
              regex = re.compile(pattern, flags)
              matches = list(regex.finditer(text))

              if len(matches) != 1:
                  raise RuntimeError(
                      f"{name}: expected exactly 1 match, "
                      f"found {len(matches)}"
                  )

              return regex, matches[0]


          # ====================================================
          # 1. OEM / PXL BOOT SCREEN
          # ====================================================

          prefs = root / "userPrefs.jsonc"
          text = read(prefs)

          prefs_values = {
              "USERPREFS_OEM_TEXT":
                  '"PXL Mesh"',

              "USERPREFS_OEM_FONT_SIZE":
                  '"0"',

              # Meshtastic 2.7.x expects image defines whenever
              # OEM_TEXT is enabled.
              # 1x1 blank image = essentially invisible.
              "USERPREFS_OEM_IMAGE_WIDTH":
                  '"1"',

              "USERPREFS_OEM_IMAGE_HEIGHT":
                  '"1"',

              "USERPREFS_OEM_IMAGE_DATA":
                  '"{ 0x00 }"',
          }


          for key, value in prefs_values.items():

              pattern = re.compile(
                  rf'(?m)^'
                  rf'(?P<indent>\s*)'
                  rf'(?://\s*)?'
                  rf'"{re.escape(key)}"'
                  rf'\s*:\s*'
                  rf'.*?,'
                  rf'\s*$'
              )

              matches = list(pattern.finditer(text))

              if len(matches) != 1:
                  raise RuntimeError(
                      f"userPrefs.jsonc: "
                      f"could not uniquely find {key}; "
                      f"matches={len(matches)}"
                  )

              indent = matches[0].group("indent")

              replacement = (
                  f'{indent}"{key}": {value},'
              )

              text = (
                  text[:matches[0].start()]
                  + replacement
                  + text[matches[0].end():]
              )

          write(prefs, text)


          # ====================================================
          # 2. Screen.cpp
          #
          # - +1 static frame capacity
          # - shorter boot splash
          # - PXL STATUS frame
          # ====================================================

          screen = root / "src/graphics/Screen.cpp"
          text = read(screen)


          # -------- NUM_EXTRA_FRAMES --------

          regex, match = find_one(
              r'(?m)^'
              r'(?P<prefix>\s*#define\s+NUM_EXTRA_FRAMES\s+)'
              r'(?P<count>\d+)'
              r'(?P<rest>.*)$',
              text,
              "NUM_EXTRA_FRAMES"
          )

          old_count = int(match.group("count"))
          new_count = old_count + 1

          replacement = (
              match.group("prefix")
              + str(new_count)
              + match.group("rest")
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          print(
              f"NUM_EXTRA_FRAMES: "
              f"{old_count} -> {new_count}"
          )


          # -------- Boot timeout --------

          regex, match = find_one(
              r'uint32_t\s+logo_timeout\s*=\s*\d+\s*;',
              text,
              "logo_timeout"
          )

          text = (
              text[:match.start()]
              + "uint32_t logo_timeout = 2500;"
              + text[match.end():]
          )


          # -------- Insert PXL frame --------
          #
          # IMPORTANT:
          # We only search the BEGINNING of the system frame.
          # No brittle multiline whitespace matching anymore.
          #

          regex, match = find_one(
              r'(?m)^'
              r'(?P<indent>[ \t]*)'
              r'if\s*\(\s*!hiddenFrames\.system\s*\)\s*\{',
              text,
              "system frame"
          )

          indent = match.group("indent")

          pxl_frame = (
              f"{indent}// PXL custom status screen\n"
              f"{indent}normalFrames[numframes++] = "
              f"graphics::DebugRenderer::drawPxlStatus;\n"
              f"{indent}indicatorIcons.push_back(icon_system);\n"
              f"\n"
          )

          text = (
              text[:match.start()]
              + pxl_frame
              + text[match.start():]
          )

          write(screen, text)


          # ====================================================
          # 3. DebugRenderer.h
          # ====================================================

          header = root / "src/graphics/draw/DebugRenderer.h"
          text = read(header)

          regex, match = find_one(
              r'(?m)^'
              r'(?P<indent>[ \t]*)'
              r'void\s+drawSystemScreen\s*\(',
              text,
              "drawSystemScreen declaration"
          )

          indent = match.group("indent")

          declaration = (
              f"{indent}// PXL custom status screen\n"
              f"{indent}void drawPxlStatus("
              f"OLEDDisplay *display, "
              f"OLEDDisplayUiState *state, "
              f"int16_t x, int16_t y);\n"
              f"\n"
          )

          text = (
              text[:match.start()]
              + declaration
              + text[match.start():]
          )

          write(header, text)


          # ====================================================
          # 4. DebugRenderer.cpp
          # ====================================================

          renderer = (
              root
              / "src/graphics/draw/DebugRenderer.cpp"
          )

          text = read(renderer)

          regex, match = find_one(
              r'(?m)^'
              r'(?P<indent>[ \t]*)'
              r'void\s+drawSystemScreen\s*\(',
              text,
              "drawSystemScreen implementation"
          )


          pxl_status = r'''
          // ****************************
          // *      PXL STATUS          *
          // ****************************
          void drawPxlStatus(
              OLEDDisplay *display,
              OLEDDisplayUiState *state,
              int16_t x,
              int16_t y)
          {
              display->clear();
              display->setTextAlignment(TEXT_ALIGN_LEFT);
              display->setFont(FONT_SMALL);

              graphics::drawCommonHeader(
                  display,
                  x,
                  y,
                  "PXL STATUS"
              );

              char line[32];


              // Battery
              if (powerStatus->getHasBattery()) {

                  snprintf(
                      line,
                      sizeof(line),
                      "BAT %d%%  %.2fV",
                      powerStatus
                          ->getBatteryChargePercent(),
                      powerStatus
                          ->getBatteryVoltageMv()
                          / 1000.0f
                  );

              } else {

                  snprintf(
                      line,
                      sizeof(line),
                      "BAT USB"
                  );
              }

              display->drawString(
                  x,
                  getTextPositions(display)[1],
                  line
              );


              // Nodes
              snprintf(
                  line,
                  sizeof(line),
                  "NODES %d/%d",
                  nodeStatus->getNumOnline(),
                  nodeStatus->getNumTotal()
              );

              display->drawString(
                  x,
                  getTextPositions(display)[2],
                  line
              );


              // Airtime
              snprintf(
                  line,
                  sizeof(line),
                  "CH %.1f%%  AIR %.1f%%",
                  airTime
                      ->channelUtilizationPercent(),
                  airTime
                      ->utilizationTXPercent()
              );

              display->drawString(
                  x,
                  getTextPositions(display)[3],
                  line
              );


              // Device role
              auto role =
                  DisplayFormatters
                      ::getDeviceRole(
                          config.device.role
                      );

              snprintf(
                  line,
                  sizeof(line),
                  "ROLE %s",
                  role
              );

              display->drawString(
                  x,
                  getTextPositions(display)[4],
                  line
              );

              graphics::drawCommonFooter(
                  display,
                  x,
                  y
              );
          }


          '''

          text = (
              text[:match.start()]
              + pxl_status
              + text[match.start():]
          )

          write(renderer, text)


          # ====================================================
          # DONE
          # ====================================================

          print()
          print("=================================")
          print("PXL patches applied")
          print("=================================")
          print("+ PXL Mesh OEM boot")
          print("+ PXL STATUS")
          print("+ shorter boot splash")
          print("+ radio stack unchanged")
          print("+ power limit unchanged")
          print("=================================")

          PY


      # --------------------------------------------------------
      # Verify patch
      # --------------------------------------------------------

      - name: Show PXL diff
        working-directory: firmware
        run: |
          git diff --check
          git --no-pager diff --stat
          git --no-pager diff


      # --------------------------------------------------------
      # Build
      #
      # Official Meshtastic build system reads OLED_RU from PREFS.
      # --------------------------------------------------------

      - name: Build ${{ matrix.display_name }}
        working-directory: firmware
        shell: bash
        env:
          PREFS: "OLED_RU"
        run: |
          echo "Building ${{ matrix.board }}"
          echo "PREFS=$PREFS"

          pio run -e "${{ matrix.board }}"


      # --------------------------------------------------------
      # Package board firmware
      # --------------------------------------------------------

      - name: Package firmware
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          EXT: ${{ matrix.extension }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          mkdir -p dist

          BUILD_DIR="firmware/.pio/build/$BOARD"

          if [ "$EXT" = "uf2" ]; then
            SOURCE="$BUILD_DIR/firmware.uf2"
          else
            SOURCE="$BUILD_DIR/firmware.bin"
          fi

          if [ ! -f "$SOURCE" ]; then

            echo "Expected $SOURCE was not found."
            echo "Trying to locate firmware *.$EXT..."

            SOURCE="$(
              find "$BUILD_DIR" \
                -maxdepth 1 \
                -type f \
                -name "firmware*.$EXT" \
                | head -n 1
            )"
          fi


          if [ -z "$SOURCE" ] || [ ! -f "$SOURCE" ]; then
            echo "ERROR: firmware file not found"
            find "$BUILD_DIR" -maxdepth 1 -type f -print
            exit 1
          fi


          OUT="dist/meshtastic-${BOARD}-${UPSTREAM_TAG}-PXL.${PXL_REV}.${EXT}"

          cp "$SOURCE" "$OUT"

          sha256sum "$OUT" > "$OUT.sha256"


          cat > "dist/${BOARD}-BUILD.txt" <<EOF
          PXL Meshtastic

          Upstream:
          ${UPSTREAM_TAG}

          Board:
          ${BOARD}

          PXL revision:
          ${PXL_REV}

          Customizations:
          - OLED_RU
          - PXL Mesh OEM boot screen
          - PXL STATUS
          - shorter boot splash

          Radio stack:
          UNCHANGED

          Region power limits:
          UNCHANGED

          This file is NOT factory firmware.
          EOF


          echo
          echo "Produced:"
          ls -lah dist


      # --------------------------------------------------------
      # Upload per-board artifact
      # --------------------------------------------------------

      - name: Upload ${{ matrix.display_name }}
        uses: actions/upload-artifact@v4
        with:
          name: pxl-${{ matrix.board }}
          path: dist/
          retention-days: 30


  # ============================================================
  # One release containing ALL boards
  # ============================================================

  release:
    needs:
      - prepare
      - build

    if: >
      needs.prepare.outputs.skip != 'true' &&
      needs.build.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: pxl-*
          path: dist
          merge-multiple: true


      - name: Show release files
        run: |
          find dist -maxdepth 1 -type f -print
          ls -lah dist


      - name: Publish PXL Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PXL_TAG: ${{ needs.prepare.outputs.pxl_tag }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |

          NOTES=$(cat <<EOF
          ## PXL Meshtastic

          Based on official Meshtastic:

          **${UPSTREAM_TAG}**

          ### PXL changes

          - OLED_RU
          - PXL Mesh OEM boot screen
          - PXL STATUS screen
          - shorter boot splash

          ### Unchanged

          - LoRa radio stack
          - routing
          - protocol
          - region limits
          - RU power limit

          ### Boards

          - LilyGo T3S3
          - LilyGo T3S3 E-Paper
          - LilyGo T3S3 E-Paper InkHUD
          - Heltec V3
          - Heltec V4
          - Heltec Mesh Node T114
          - Heltec Mesh Node T096

          ESP32 builds use \`.bin\`.

          nRF52840 builds use \`.uf2\`.

          No factory firmware is published.
          EOF
          )


          if gh release view "$PXL_TAG" >/dev/null 2>&1; then

            echo "Updating existing release $PXL_TAG"

            gh release upload \
              "$PXL_TAG" \
              dist/* \
              --clobber

            gh release edit \
              "$PXL_TAG" \
              --title "PXL Meshtastic ${UPSTREAM_TAG}" \
              --notes "$NOTES"

          else

            echo "Creating release $PXL_TAG"

            gh release create \
              "$PXL_TAG" \
              dist/* \
              --title "PXL Meshtastic ${UPSTREAM_TAG}" \
              --notes "$NOTES"

          fi
